<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="format-detection" content="telephone=no">
    
    <title>The Wedding of Aulia & Amar</title>
    
    <link rel="preload" as="image" href="cover.png" fetchpriority="high">
    <link rel="preload" as="image" href="part2.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&family=Alex+Brush&family=Amiri&display=block" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <audio id="bgMusic" src="Wedding Nasheed.mp3" loop></audio>

    <div id="cover-page">
        <!-- Background selalu video ini, tidak berubah -->
        <video autoplay loop muted playsinline webkit-playsinline class="cover-bg-video" preload="auto">
            <source src="background.mp4" type="video/mp4">
        </video>

        <div class="external-guest-box" id="guestBox">
            <p>Kepada Yth.</p>
            <h3 id="guest-name">Tamu Undangan</h3>
        </div>

        <div class="book-scene" id="book" onclick="openInvitation()">
            <div class="hardcover-back"></div>
            <div class="book-spine"></div>
            
            <div class="pages-block">
                <div class="inside-video-frame">
                    <video id="invitationVideo" loop muted playsinline preload="metadata">
                        <source src="part3.mp4" type="video/mp4">
                    </video>
                    <div class="inside-date-arabic" dir="ltr">٢٨ ✦ ٠٦ ✦ ٢٦</div>
                </div>
            </div>

            <div class="page page-3">
                <div class="page-front"></div>
                <div class="page-back">
                    <img src="part2.png" alt="Bagian Kiri">
                </div>
            </div>
            <div class="page page-2"></div>
            <div class="page page-1"></div>
            
            <div class="hardcover-front wind-flutter">
                <img src="cover.png" alt="Sampul" class="cover-img" fetchpriority="high" decoding="sync">
                <div class="front-content">
                    <p class="pre-title">THE WEDDING OF</p>
                    <h1 class="shimmer-text">Aulia<br>&<br>Amar</h1>
                    <p class="elegant-date">28 • 06 • 2026</p>
                </div>
            </div>
            <div class="hint-text">TAP TO OPEN</div>
        </div>

        <!-- Watermark ini HANYA ada di index.html -->
        <div class="watermark">
            <span class="wm-text-1">© 2026 DESIGN BY</span>
            <span class="wm-text-2">Muhammad Amar</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
